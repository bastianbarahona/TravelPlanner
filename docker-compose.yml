services:
  provider-mock:
    build:
      context: .
      dockerfile: provider-mock/Dockerfile
    ports:
      - "${MOCK_PORT:-4010}:4010"
    environment:
      MOCK_DB_PATH: /data/provider-mock.db
      MOCK_TOKENS: ${MOCK_TOKENS:-travel-demo-token:travel-app}
      MOCK_QUOTE_TTL_SECONDS: ${MOCK_QUOTE_TTL_SECONDS:-900}
      MOCK_SUPPLIER_DEADLINE_SECONDS: ${MOCK_SUPPLIER_DEADLINE_SECONDS:-5}
      MOCK_PENDING_DELAY_SECONDS: ${MOCK_PENDING_DELAY_SECONDS:-5}
      MOCK_CONTROL_ENABLED: ${MOCK_CONTROL_ENABLED:-0}
    volumes:
      - provider-mock-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4010/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: the image's temporary init server listens on the Unix socket only, so a socket check reports healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U travel -d travel"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # One job that exits. The application never migrates itself: two simultaneous upgrades failed 8 of 8 rounds.
  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["alembic", "-c", "app/db/alembic.ini", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: postgresql+psycopg://travel:travel@db:5432/travel
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_DATABASE_URL: postgresql+psycopg://travel:travel@db:5432/travel
      APP_TOKENS: ${APP_TOKENS:-token-ana:ana,token-ben:ben,token-cam:cam,token-dee:dee}
      PROVIDER_BASE_URL: http://provider-mock:4010/v1
      PROVIDER_TOKEN: ${PROVIDER_TOKEN:-travel-demo-token}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      DOCUMENT_WORKER_ENABLED: ${DOCUMENT_WORKER_ENABLED:-1}
      DOCUMENT_LEASE_SECONDS: ${DOCUMENT_LEASE_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # The browser calls /api on this origin: nginx strips the prefix and forwards to the app, so there is no CORS.
  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget may try ::1 first, and nginx listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  provider-mock-data:
  app-db-data:
