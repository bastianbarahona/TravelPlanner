<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="class-model-title class-model-desc" id="class-model-root">
        <title id="class-model-title">Persistent domain model</title>
        <desc id="class-model-desc">Class diagram of the six persisted classes: a Trip owns its destinations, participants and itinerary items, an itinerary item has booking attempts, and a trip has documents.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #class-model-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #class-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #class-model-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#class-model-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="class-model-uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="class-model-uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
          </marker>
          <marker id="class-model-uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="class-model-uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Relationships (drawn before boxes) -->
        <!-- Trip owns TripDestination -->
        <path d="M440 136 H240" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#class-model-uml-diamond-filled)"/>
        <!-- Trip owns TripParticipant -->
        <path d="M440 232 H240" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#class-model-uml-diamond-filled)"/>
        <!-- Trip owns ItineraryItem -->
        <path d="M680 152 H880" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#class-model-uml-diamond-filled)"/>
        <!-- BookingAttempt refers to ItineraryItem (FK side to the 1 side) -->
        <path d="M1040 364 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#class-model-uml-open)"/>
        <!-- Document refers to Trip -->
        <path d="M520 364 V264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#class-model-uml-open)"/>

        <!-- Multiplicities and constraints, each on an opaque paper mask clear of its stroke -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">
          <!-- Trip - TripDestination -->
          <rect x="398" y="118" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="408" y="127" fill="#2d3142" font-weight="600">1</text>
          <rect x="250" y="118" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="264" y="127" fill="#2d3142" font-weight="600">1..*</text>
          <rect x="312" y="142" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="340" y="151" fill="#5a6580">{ordered}</text>
          <!-- Trip - TripParticipant -->
          <rect x="398" y="214" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="408" y="223" fill="#2d3142" font-weight="600">1</text>
          <rect x="250" y="214" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="264" y="223" fill="#2d3142" font-weight="600">1..*</text>
          <rect x="304" y="238" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="340" y="247" fill="#5a6580">{exactly one</text>
          <rect x="309" y="254" width="62" height="12" rx="2" fill="#f5f5f5"/><text x="340" y="263" fill="#5a6580">organizer}</text>
          <!-- Trip - ItineraryItem -->
          <rect x="700" y="134" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="710" y="143" fill="#2d3142" font-weight="600">1</text>
          <rect x="846" y="134" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="860" y="143" fill="#2d3142" font-weight="600">0..*</text>
          <rect x="752" y="158" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="780" y="167" fill="#5a6580">{ordered}</text>
          <rect x="740" y="174" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="780" y="183" fill="#5a6580">{1 per offer}</text>
          <!-- ItineraryItem - BookingAttempt -->
          <rect x="1014" y="236" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="1024" y="245" fill="#2d3142" font-weight="600">1</text>
          <rect x="1006" y="336" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="1020" y="345" fill="#2d3142" font-weight="600">0..*</text>
          <rect x="1046" y="262" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="1080" y="271" fill="#5a6580">{max 1 open</text>
          <rect x="1046" y="278" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="1086" y="287" fill="#5a6580">or confirmed}</text>
          <rect x="1046" y="306" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="1078" y="315" fill="#5a6580">{ON DELETE</text>
          <rect x="1046" y="322" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="1078" y="331" fill="#5a6580">RESTRICT}</text>
          <!-- Trip - Document -->
          <rect x="494" y="272" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="504" y="281" fill="#2d3142" font-weight="600">1</text>
          <rect x="486" y="336" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="500" y="345" fill="#2d3142" font-weight="600">0..*</text>
          <rect x="526" y="300" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="568" y="309" fill="#5a6580">{source_sha256</text>
          <rect x="526" y="316" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="562" y="325" fill="#5a6580">unique/trip}</text>
        </g>

        <!-- Class: TripDestination -->
        <rect x="40" y="104" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="40" y1="144" x2="240" y2="144" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="140" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TripDestination</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#2d3142">
          <text x="56" y="164">+ position: int</text>
          <text x="56" y="184">+ name: str</text>
        </g>

        <!-- Class: TripParticipant -->
        <rect x="40" y="220" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="40" y1="260" x2="240" y2="260" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="140" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TripParticipant</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#2d3142">
          <text x="56" y="280">+ user_id: str</text>
          <text x="56" y="300">+ role: Role</text>
        </g>

        <!-- Class: Trip -->
        <rect x="440" y="104" width="240" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="440" y1="144" x2="680" y2="144" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="560" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trip</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#2d3142">
          <text x="456" y="164">+ starts_on: date</text>
          <text x="456" y="184">+ ends_on: date</text>
          <text x="456" y="204">+ budget_usd: Decimal {NUMERIC(12,2)}</text>
          <text x="456" y="224">+ travelers: int {1..20}</text>
          <text x="456" y="244">+ version: int {ours, optimistic lock}</text>
        </g>

        <!-- Class: ItineraryItem -->
        <rect x="880" y="104" width="320" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="880" y1="144" x2="1200" y2="144" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="1040" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ItineraryItem</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#2d3142">
          <text x="896" y="164">+ position: int</text>
          <text x="896" y="184">+ offer: dict {provider offer, revision: str}</text>
          <text x="896" y="204">+ /price_kind: estimate | confirmed</text>
        </g>

        <!-- Class: Document -->
        <rect x="440" y="364" width="320" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="440" y1="404" x2="760" y2="404" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="600" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Document</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#2d3142">
          <text x="456" y="424">+ source: dict {trip + items + budget snapshot}</text>
          <text x="456" y="444">+ source_sha256: str</text>
          <text x="456" y="464">+ state: DocumentState</text>
          <text x="456" y="484">+ content: bytes? {rendered HTML file}</text>
          <text x="456" y="504">+ …</text>
        </g>

        <!-- Class: BookingAttempt (focal, accent) -->
        <rect x="880" y="364" width="320" height="160" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.04"/>
        <rect x="880" y="364" width="320" height="40" rx="6" fill="#bf4520" fill-opacity="0.10"/>
        <rect x="880" y="396" width="320" height="8" fill="#bf4520" fill-opacity="0.10"/>
        <line x1="880" y1="404" x2="1200" y2="404" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
        <text x="1040" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BookingAttempt</text>
        <g font-size="9" font-family="'Geist Mono', monospace" fill="#2d3142">
          <text x="896" y="424">+ attempt_no: int</text>
          <text x="896" y="444">+ state: BookingState</text>
          <text x="896" y="464">+ request: dict {sent as stored; resent on retry}</text>
          <text x="896" y="484">+ booking: dict? {provider Booking, raw}</text>
          <text x="896" y="504">+ …</text>
        </g>

        <!-- Enumerations key (text, not boxes: the class budget is 7 boxes) -->
        <line x1="40" y1="364" x2="380" y2="364" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENUMERATIONS</text>
        <g fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">
          <text x="40" y="412">Role</text>
          <text x="40" y="460">BookingState</text>
          <text x="40" y="508">DocumentState</text>
        </g>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">
          <text x="40" y="428">organizer | editor | viewer</text>
          <text x="40" y="476">unknown | pending | confirmed | failed | rejected</text>
          <text x="40" y="524">waiting | in_progress | complete | failed</text>
        </g>

        <!-- Legend: relationship vocabulary -->
        <line x1="40" y1="660" x2="1240" y2="660" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

        <line x1="40" y1="692" x2="68" y2="692" stroke="#2d3142" stroke-width="1" marker-end="url(#class-model-uml-triangle)"/>
        <text x="76" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

        <line x1="190" y1="692" x2="218" y2="692" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#class-model-uml-triangle)"/>
        <text x="226" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

        <line x1="340" y1="692" x2="368" y2="692" stroke="#2d3142" stroke-width="1" marker-start="url(#class-model-uml-diamond-filled)"/>
        <text x="376" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

        <line x1="490" y1="692" x2="518" y2="692" stroke="#2d3142" stroke-width="1" marker-start="url(#class-model-uml-diamond-hollow)"/>
        <text x="526" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aggregation · has</text>

        <line x1="640" y1="692" x2="668" y2="692" stroke="#4f5d75" stroke-width="1" marker-end="url(#class-model-uml-open)"/>
        <text x="676" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association · FK side to 1 side</text>

        <line x1="840" y1="692" x2="868" y2="692" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#class-model-uml-open)"/>
        <text x="876" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>

        <text x="1000" y="696" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">/ derived · ? nullable · { } constraint</text>
      </svg>
