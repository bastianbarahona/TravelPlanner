<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-booking-attempt-title state-booking-attempt-desc" id="state-booking-attempt-root">
        <title id="state-booking-attempt-title">BookingAttempt lifecycle</title>
        <desc id="state-booking-attempt-desc">State machine of one booking attempt: it starts as unknown before the provider call, moves to pending, confirmed, failed or rejected only as the provider answers, and confirmed, failed and rejected never change.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #state-booking-attempt-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #state-booking-attempt-root { font-family: var(--font-sans); color: var(--color-ink); }
      #state-booking-attempt-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#state-booking-attempt-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="state-booking-attempt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="state-booking-attempt-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="state-booking-attempt-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Transitions (drawn first, nodes after) -->
        <!-- initial -> unknown -->
        <line x1="50" y1="256" x2="128" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <!-- unknown -> unknown (accent, the retry loop) -->
        <path d="M176 192 V160 Q176 152 184 152 H264 Q272 152 272 160 V192" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#state-booking-attempt-arrow-accent)"/>
        <!-- unknown -> pending -->
        <line x1="368" y1="216" x2="464" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <!-- unknown -> confirmed (over the top) -->
        <path d="M328 192 V56 Q328 48 336 48 H872 Q880 48 880 56 V72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <!-- unknown -> failed -->
        <line x1="368" y1="256" x2="720" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <!-- unknown -> rejected -->
        <path d="M368 296 H672 Q680 296 680 304 V400 Q680 408 688 408 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <!-- pending -> pending -->
        <path d="M504 160 V128 Q504 120 512 120 H576 Q584 120 584 128 V160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <!-- pending -> confirmed -->
        <path d="M624 176 H672 Q680 176 680 168 V116 Q680 108 688 108 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <!-- pending -> failed -->
        <line x1="624" y1="216" x2="720" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>

        <!-- Transition labels, each on an opaque paper mask with a 6 to 8px gap from its stroke -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#5a6580">
          <rect x="55" y="238" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="89" y="247">BEFORE POST</text>
          <rect x="194" y="134" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="224" y="143" fill="#bf4520">NO ANSWER</text>
          <rect x="382" y="198" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="416" y="207">BODY STATUS</text>
          <rect x="566" y="54" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="600" y="63">BODY STATUS</text>
          <rect x="506" y="262" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="540" y="271">BODY STATUS</text>
          <rect x="497" y="302" width="46" height="12" rx="2" fill="#f5f5f5"/><text x="520" y="311">REFUSED</text>
          <rect x="504" y="102" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="544" y="111">STILL PENDING</text>
          <rect x="604" y="130" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="638" y="139">BODY STATUS</text>
          <rect x="638" y="198" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="672" y="207">BODY STATUS</text>
        </g>

        <!-- Initial pseudostate -->
        <circle cx="44" cy="256" r="6" fill="#2d3142"/>

        <!-- State: unknown (focal, accent) -->
        <rect x="128" y="192" width="240" height="128" rx="8" fill="#f5f5f5"/>
        <rect x="128" y="192" width="240" height="128" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="136" y="200" width="40" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="156" y="209" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="248" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">unknown</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="248" y="250" fill="#bf4520">our state, not the provider's</text>
          <text x="248" y="264">stays on: timeout · 5xx · 429 · 401</text>
          <text x="248" y="278">undeclared or invalid answer</text>
          <text x="248" y="292">user retry, same key and request</text>
          <text x="248" y="306">reconciler read that learns nothing</text>
        </g>

        <!-- State: pending -->
        <rect x="464" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="472" y="168" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="492" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="544" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pending</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="544" y="214">provider is processing</text>
          <text x="544" y="228">moves only forward</text>
        </g>

        <!-- State: confirmed (final) -->
        <rect x="720" y="72" width="200" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="720" y="72" width="200" height="80" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="728" y="80" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="748" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
        <text x="820" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">confirmed</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="820" y="126">item is booked</text>
          <text x="820" y="140">no new attempt can start</text>
        </g>

        <!-- State: failed (final) -->
        <rect x="720" y="192" width="200" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="720" y="192" width="200" height="80" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="728" y="200" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="748" y="209" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
        <text x="820" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">failed</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="820" y="246">provider could not book it</text>
          <text x="820" y="260">new attempt may start</text>
        </g>

        <!-- State: rejected (final) -->
        <rect x="720" y="368" width="200" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="720" y="368" width="200" height="96" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="728" y="376" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="748" y="385" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
        <text x="820" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rejected</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="820" y="422">404 · 409 OFFER_* · 400</text>
          <text x="820" y="436">(400 only on the first POST)</text>
          <text x="820" y="450">new attempt may start</text>
        </g>

        <!-- Annotation callouts (margins, dashed leaders) -->
        <text x="920" y="498" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">failed and rejected free the item: a new attempt</text>
        <text x="920" y="516" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">is a new row, attempt_no + 1, new key and reference</text>
        <path d="M810 484 Q806 474 800 466" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="800" cy="464" r="2" fill="#2d3142"/>

        <text x="128" y="498" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">A late answer never overwrites a state that moved on:</text>
        <text x="128" y="516" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">the monotonic rule is the UPDATE's WHERE (MAY_REPLACE)</text>
        <path d="M200 484 Q190 400 200 324" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="200" cy="322" r="2" fill="#2d3142"/>

        <!-- Legend: horizontal strip -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <circle cx="48" cy="576" r="4" fill="#2d3142"/>
        <text x="60" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Initial · row committed before the POST</text>

        <rect x="264" y="570" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="292" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Our state, not the provider's</text>

        <rect x="448" y="570" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="476" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State read from Booking.status</text>

        <rect x="636" y="570" width="20" height="12" rx="3" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="664" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final · never changes</text>

        <line x1="780" y1="576" x2="808" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#state-booking-attempt-arrow)"/>
        <text x="816" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>
      </svg>
