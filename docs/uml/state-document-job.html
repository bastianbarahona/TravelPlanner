<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document job lifecycle · UML state machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">TravelPlanner · UML · State machine</p>
    <h1>Document job lifecycle</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-document-job-title state-document-job-desc">
        <title id="state-document-job-title">Document job lifecycle</title>
        <desc id="state-document-job-desc">State machine of a trip document job: waiting, in_progress, complete and failed, with a lease-fenced write into complete, up to three render attempts, and a user retry out of failed.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Transitions (drawn first, nodes after) -->
        <!-- initial -> waiting -->
        <line x1="46" y1="208" x2="120" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- waiting -> in_progress (claim) -->
        <line x1="300" y1="192" x2="412" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- in_progress -> waiting (render failed, attempts under 3) -->
        <line x1="412" y1="232" x2="300" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- in_progress -> in_progress (lease expired, claimed again) -->
        <path d="M470 160 V136 Q470 128 478 128 H526 Q534 128 534 136 V160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- in_progress -> complete (accent: the fenced write) -->
        <line x1="592" y1="208" x2="704" y2="208" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- in_progress -> failed -->
        <line x1="502" y1="256" x2="502" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- complete -> failed (re-hash mismatch on download) -->
        <path d="M794 256 V404 Q794 412 786 412 H602" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- failed -> waiting (user retry) -->
        <path d="M402 412 H218 Q210 412 210 404 V256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Transition labels, each on an opaque paper mask with a 6 to 8px gap from its stroke -->
        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#5a6580">
          <rect x="52" y="190" width="62" height="12" rx="2" fill="#f5f5f5"/><text x="83" y="199">POST · 202</text>
          <rect x="338" y="174" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="356" y="183">CLAIM</text>
          <rect x="316" y="238" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="356" y="247">ERROR · TRY&lt;3</text>
          <rect x="462" y="108" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="502" y="117">LEASE EXPIRED</text>
          <rect x="612" y="214" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="648" y="223" fill="#bf4520">FENCED WRITE</text>
          <rect x="510" y="296" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="550" y="305">ERROR · TRY 3</text>
          <rect x="510" y="312" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="550" y="321">CLAIM · TRY&gt;3</text>
          <rect x="659" y="394" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="699" y="403">HASH MISMATCH</text>
          <rect x="639" y="418" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="699" y="427">409 DOCUMENT_CORRUPT</text>
          <rect x="279" y="394" width="62" height="12" rx="2" fill="#f5f5f5"/><text x="310" y="403">USER RETRY</text>
          <rect x="274" y="418" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="310" y="427">ATTEMPTS = 0</text>
        </g>

        <!-- Initial pseudostate -->
        <circle cx="40" cy="208" r="6" fill="#2d3142"/>

        <!-- State: waiting -->
        <rect x="120" y="160" width="180" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="148" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="210" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">waiting</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="210" y="222">queued for a worker</text>
          <text x="210" y="236">source snapshot stored</text>
        </g>

        <!-- State: in_progress -->
        <rect x="412" y="160" width="180" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="420" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="440" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="502" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">in_progress</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="502" y="216">claimed: SKIP LOCKED</text>
          <text x="502" y="230">fresh lease token</text>
          <text x="502" y="244">attempts + 1 per claim</text>
        </g>

        <!-- State: complete (focal, accent) -->
        <rect x="704" y="160" width="180" height="96" rx="8" fill="#f5f5f5"/>
        <rect x="704" y="160" width="180" height="96" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="712" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="732" y="177" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="794" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">complete</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="794" y="222">content + sha256 stored</text>
          <text x="794" y="236">lease cleared</text>
        </g>

        <!-- State: failed -->
        <rect x="402" y="372" width="200" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="402" y="372" width="200" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="410" y="380" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="430" y="389" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="502" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">failed</text>
        <g font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" fill="#4f5d75">
          <text x="502" y="426">render ×3 · interrupted · corrupt</text>
          <text x="502" y="440">waits for a user retry</text>
        </g>

        <!-- Annotation callouts (top margin, dashed leaders) -->
        <text x="40" y="72" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">A repeated request for the same source</text>
        <text x="40" y="90" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">returns the stored document (uq_documents_source)</text>
        <path d="M170 98 Q170 130 180 158" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="180" cy="160" r="2" fill="#2d3142"/>

        <text x="920" y="72" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">Every write that ends a claim is fenced by lease_token:</text>
        <text x="920" y="90" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">a worker that lost its lease drops its result</text>
        <path d="M700 98 Q690 160 662 206" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="662" cy="208" r="2" fill="#2d3142"/>

        <!-- Legend: horizontal strip -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <circle cx="48" cy="576" r="4" fill="#2d3142"/>
        <text x="60" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Initial · source captured in one REPEATABLE READ snapshot</text>

        <rect x="340" y="570" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="368" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State</text>

        <rect x="432" y="570" width="20" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="460" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Lease-fenced completion</text>

        <line x1="624" y1="576" x2="652" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="660" y="579" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>
      </svg>
    </div>
  </div>
</body>
</html>
