server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's resolver, with a short cache: a literal host in proxy_pass is resolved once at start, so recreating
    # `app` alone would leave /api on a stale address (502). The variable makes nginx resolve it per request.
    resolver 127.0.0.11 valid=10s;

    # /api/x goes to the app as /x. With a variable in proxy_pass the URI is not rewritten for us, so the prefix is
    # stripped here (the query string is kept). 60 s is well above the app's 10 s provider timeout, so a slow search
    # ends as the app's own answer, never as a gateway timeout.
    location /api/ {
        set $app http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $app;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }

    # A rebuild must never be served from a stale cached shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single page: any other path serves the app.
    location / {
        try_files $uri /index.html;
    }
}
